#
#                    FREE RedM ROLEPLAY FRAMEWORK  -  server.cfg
#
#   Recipe   : {{recipeName}}
#   Author   : {{recipeAuthor}}
#
#   Sections
#     01  Network            06  JRS Core framework
#     02  Game               07  JRS scripts (by category)
#     03  Database           08  Your resources
#     04  Server info        09  Permissions
#     05  Base resources     10  License
#
#   NOTE  Load order matters. Keep the JRS Core block (06) before the
#         category scripts (07) and add your own scripts in section 08.
#
##################################################################################


# ================================================================================
#  01  NETWORK
# ================================================================================
{{serverEndpoints}}


# ================================================================================
#  02  GAME
# ================================================================================
set gamename rdr3
set sv_enforceGameBuild 1491
sv_scriptHookAllowed 0

# OneSync is enabled from the txAdmin settings page (keep it ON)
set onesync_population true
set onesync_distanceCulling true


# ================================================================================
#  03  DATABASE  (oxmysql)
# ================================================================================
set mysql_connection_string "{{dbConnectionString}}"
set mysql_ui false
set mysql_slow_query_warning 1000
set mysql_resultset_warning 100000
set mysql_versioncheck 0


# ================================================================================
#  04  SERVER INFO
# ================================================================================
# Server name = the name you chose in txAdmin. Change it here any time.
sv_hostname "{{serverName}} | JRS Core"
sets sv_projectName "[JRS Core] {{serverName}}"
sets sv_projectDesc "{{recipeDescription}}"
sets locale "ar-SA"
sets tags "jrs, jrscore, roleplay, redm"
sv_maxclients {{maxClients}}
# 96x96 PNG next to server.cfg
load_server_icon icon.png

# Steam Web API key - REQUIRED: players are rejected at "Checking Steam" without it
# (or set Config.RequireSteam = false in jrs_core/config/config.lua)
# https://steamcommunity.com/dev/apikey
set steam_webApiKey "none"
# set jrs_loadingscreen_steam_api_key "YOUR_STEAM_WEB_API_KEY"
# set jrs_loadingscreen_discord_token "YOUR_DISCORD_BOT_TOKEN"


# ================================================================================
#  05  BASE RESOURCES
# ================================================================================

# ---- [CFX] -------------------------------------------------------------------
ensure yarn
ensure mapmanager
ensure sessionmanager-rdr3
ensure spawnmanager
ensure redm-map-one
ensure hardcap
ensure screenshot-basic

# ---- [DEPENDENCIES] ------------------------------------------------------------
# database driver - must start first
ensure oxmysql
ensure [DEPENDENCIES]

# chat (other resources add their /command suggestions to it)
ensure jrs_chat


# ================================================================================
#  06  JRS CORE FRAMEWORK            (order matters - do not reorder)
# ================================================================================
# framework + built-in menu / inputs / lib
ensure jrs_core
ensure jrs_inventory
ensure jrs_loadingscreen
# GitHub update checker (prints a notice when a newer JRS Core version exists)
ensure jrs_updater
ensure jrs_clothing
ensure jrs_barber
ensure jrs_character
ensure jrs_billing


# ================================================================================
#  07  JRS SCRIPTS  (by category)
# ================================================================================

# ---- [CORE] --------------------------------------------------------------------
ensure jrs_progressbar
ensure jrs_minigame
ensure jrs_backpacks
ensure jrs_essentials
ensure jrs_multijob
ensure jrs_radialmenu

# ---- [CHARACTER] ---------------------------------------------------------------
ensure jrs_animations
ensure jrs_walkanim
ensure jrs_metabolism
ensure jrs_canteen
ensure jrs_playerinfo
ensure jrs_bathing
ensure jrs_3dme
ensure jrs_attached_objects
ensure jrs_passports
ensure jrs_usable_items
ensure jrs_water_actions
ensure jrs_basemenu

# ---- [ECONOMY] -----------------------------------------------------------------
ensure jrs_banking
ensure jrs_stores
ensure jrs_paycheck
ensure jrs_mailbox
ensure jrs_saloons
ensure jrs_weapons
ensure jrs_trader

# ---- [JOBS] --------------------------------------------------------------------
ensure jrs_police
ensure jrs_medic
ensure jrs_bossmanager
ensure jrs_crafting
ensure jrs_mining
ensure jrs_lumberjack
ensure jrs_fishing
ensure jrs_herbs
ensure jrs_crawfish
ensure jrs_hunting
ensure jrs_smelting
ensure jrs_goldclaim
ensure jrs_samples
ensure jrs_mdt
ensure jrs_railroad
ensure jrs_huntingpets
ensure jrs_goldpanning

# ---- [PROPERTIES] --------------------------------------------------------------
ensure jrs_housing
ensure jrs_stables
ensure jrs_wildhorse
ensure jrs_doorlocks
ensure jrs_trapdoors

# ---- [CRIME] -------------------------------------------------------------------
ensure jrs_lockpick
ensure jrs_outlaws
ensure jrs_lootnpcs
ensure jrs_robbery
ensure jrs_search

# ---- [WORLD] -------------------------------------------------------------------
ensure jrs_radius
ensure jrs_city
ensure jrs_npcs
ensure jrs_hotair
ensure jrs_track
ensure jrs_canoe
ensure jrs_guarma
ensure jrs_teleports
ensure bee_house
ensure jrs_zombies_notify
ensure jrs_zombies

# ---- [ADMIN] -------------------------------------------------------------------
ensure jrs_admin
# developer tool - leave off on live servers
# ensure jrs_imapviewtool
ensure jrs_death_logs


# ================================================================================
#  08  YOUR RESOURCES
# ================================================================================
# ensure [your-scripts]


# ================================================================================
#  09  PERMISSIONS
# ================================================================================
add_ace group.admin command allow
add_ace group.admin command.quit deny
add_ace resource.jrs_core command allow

# Owner permission: everyone in group.admin is the JRS owner in game (full admin menu, all commands).
# txAdmin puts the server owner in group.admin automatically (the line below).
add_ace group.admin jrscore.owner allow
# 1 = on a brand new database the very first account that joins becomes the owner. 0 = off
set jrs_first_player_owner 1

# weathersync admin commands
exec @weathersync/permissions.cfg

# server owner (filled in by txAdmin)
{{addPrincipalsMaster}}


# ================================================================================
#  10  LICENSE
# ================================================================================
sv_licenseKey "{{svLicense}}"

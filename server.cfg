#   server.cfg  |  {{recipeName}}  |  load order matters, add your own scripts in "Your resources"


# ---- Network -----------------------------------------------------------------
{{serverEndpoints}}
sv_maxclients {{maxClients}}

# ---- Game --------------------------------------------------------------------
set gamename rdr3
set sv_enforceGameBuild 1491
sv_scriptHookAllowed 0
set onesync_population true
set onesync_distanceCulling true

# ---- Server info -------------------------------------------------------------
sv_hostname "{{serverName}} | JRS Core"
sets sv_projectName "[JRS Core] {{serverName}}"
sets sv_projectDesc "{{recipeDescription}}"
sets tags "jrs, jrscore, roleplay, redm"
sets locale "ar-SA"
load_server_icon icon.png

# Steam Web API key (https://steamcommunity.com/dev/apikey)
# Players are rejected at "Checking Steam" without it, or set Config.RequireSteam = false in jrs_core/config/config.lua
set steam_webApiKey "none"
# set jrs_loadingscreen_steam_api_key "YOUR_STEAM_WEB_API_KEY"
# set jrs_loadingscreen_discord_token "YOUR_DISCORD_BOT_TOKEN"

# ---- Database (oxmysql) ------------------------------------------------------
set mysql_connection_string "{{dbConnectionString}}"
set mysql_ui false
set mysql_slow_query_warning 1000
set mysql_resultset_warning 100000
set mysql_versioncheck 0



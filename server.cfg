# ---- Permissions -------------------------------------------------------------
add_ace group.admin command allow
add_ace group.admin command.quit deny
add_ace resource.jrs_core command allow

# group.admin = JRS owner in game (txAdmin adds the server owner to it below)
add_ace group.admin jrscore.owner allow
# 1 = on a new database the first account that joins becomes the owner, 0 = off
set jrs_first_player_owner 1

exec @weathersync/permissions.cfg
{{addPrincipalsMaster}}


# ---- License -----------------------------------------------------------------
sv_licenseKey "{{svLicense}}"

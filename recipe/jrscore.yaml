##############################################################
#  JRS Core - Free Edition  |  txAdmin recipe
#
#  txAdmin > Setup > "Popular Template" / "Remote URL Template"
#  Paste the RAW link of this file, e.g.
#  https://raw.githubusercontent.com/JRS-CORE/jrscore/main/recipe/jrscore.yaml
#
#  Before publishing: replace NQ3Z below with the
#  GitHub account/organisation that hosts the jrscore repository.
##############################################################
$engine: 3
$minFxVersion: 7290
$onesync: on
$steamRequired: false

name: JRS Core
version: 1.0.0
author: JRS TEAM
description: JRS Core free RedM framework - core, inventory, character creator, clothing, barber and loading screen. Installs every resource, imports the database and writes server.cfg automatically.

variables:
  jrsRepo: https://github.com/JRS-CORE/jrscore
  jrsRef: main
  dbCharset: utf8mb4

tasks:
  # ---------------------------------------------------------
  # 1) Download JRS Core (resources + sql + server.cfg)
  # ---------------------------------------------------------
  - action: download_github
    src: "{{jrsRepo}}"
    ref: "{{jrsRef}}"
    dest: ./tmp/jrscore

  - action: move_path
    src: ./tmp/jrscore/resources
    dest: ./resources

  - action: move_path
    src: ./tmp/jrscore/server.cfg
    dest: ./server.cfg

  # ---------------------------------------------------------
  # 2) Database: create + import every JRS table and the item list
  # ---------------------------------------------------------
  - action: connect_database

  - action: query_database
    file: ./tmp/jrscore/sql/jrscore.sql

  - action: query_database
    file: ./tmp/jrscore/sql/jrscore_addons.sql

  - action: query_database
    file: ./tmp/jrscore/sql/jrscore_scripts.sql

  # ---------------------------------------------------------
  # 3) Clean up
  # ---------------------------------------------------------
  - action: remove_path
    path: ./tmp

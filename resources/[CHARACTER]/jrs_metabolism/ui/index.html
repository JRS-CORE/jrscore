<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>JRS Metabolism</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='assets/main.css'> 
    <script src="assets/request.js" type="text/javascript"></script>	
</head>
<body>
    <div class="main-container" hidden>
        
        <div class="item" >
            <div id="prog_circle_health" class="CTX_item"></div>
            <img src="assets/icons/heart.png">
            <div id="health_bg" class="itembg">
                <div id="prog_fill_health" class="itemFill" ></div>
            </div>
        </div> 

        <div class="item">
            <div id="prog_circle_stamina" class="CTX_item"></div>
            <img src="assets/icons/stamina.png">   
            <div id="stamina_bg" class="itembg">
                <div id="prog_fill_stamina" class="itemFill" ></div>
            </div>
        </div>

        <div class="item" >
            <div id="prog_circle_thirst" class="CTX_item"></div>
            <img src="assets/icons/thirst.png">
            <div id="thirst_bg" class="itembg">
                <div id="prog_fill_thirst" class="itemFill" ></div>
            </div>
        </div> 

        <div class="item">
            <div id="prog_circle_hunger" class="CTX_item"></div>
            <img src="assets/icons/hunger.png">   
            <div id="hunger_bg" class="itembg">
                <div class="itemFill" ></div>
            </div>
        </div>

        <div class="item" id="horseH" hidden>
            <div id="prog_circle_heart_horse" class="CTX_item"></div>
            <img src="assets/icons/heart-horse.png">   
            
            <div id="horseHealth_bg" class="itembg">
                <div id="prog_fill_heart_horse" class="itemFill" ></div>
            </div>
        </div>

        <div class="item" id="horseS" hidden>
            <div id="prog_circle_stamina_horse" class="CTX_item"></div>
            <img src="assets/icons/stamina-horse.png">

            <div id="horseStamina_bg" class="itembg">
                <div id="prog_fill_stamina_horse" class="itemFill" ></div>
            </div>

        </div>

        <div class="item">
            <div id="prog_circle_voice" class="CTX_item"></div>
            <img src="assets/icons/mic.png">
            <div id="mic_bg" class="itembg">
                <div class="itemFill" ></div>
            </div>
        </div>




    </div>

    <script src='assets/script.js'></script>
</body>
</html>

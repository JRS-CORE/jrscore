<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Preview Creator Pins</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #111;
        }
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
        }
    </style>
</head>
<body>
    <iframe id="previewFrame" src="index.html"></iframe>
    <script>
        const frame = document.getElementById('previewFrame');
        frame.onload = () => {
            setTimeout(() => {
                const win = frame.contentWindow;
                win.postMessage({
                    type: 'placeElem',
                    pins: [
                        {
                            id: "head",
                            name: "الرأس",
                            visible: true,
                            startPosition: { x: 0.49, y: 0.22 },
                            direction: "left",
                            subElem: [ { id: "headshape", name: "شكل الرأس" }, { id: "neck", name: "الرقبة" }, { id: "barber", name: "الحلاق" } ]
                        },
                        {
                            id: "eyesandbrows",
                            name: "العينان",
                            direction: "right",
                            visible: true,
                            startPosition: { x: 0.49, y: 0.26 },
                            subElem: [ { id: "brows", name: "الحواجب" }, { id: "eyes", name: "العيون" }, { id: "eyelid", name: "الجفون" } ]
                        },
                        {
                            id: "facial",
                            name: "الوجه",
                            direction: "right",
                            visible: true,
                            startPosition: { x: 0.51, y: 0.31 },
                            subElem: [ { id: "ears", name: "الأذنين" }, { id: "cheekbone", name: "عظام الخد" }, { id: "jaw", name: "الفك" }, { id: "chin", name: "الذقن" }, { id: "nose", name: "الأنف" } ]
                        },
                        {
                            id: "mouth",
                            name: "الفم",
                            direction: "left",
                            visible: true,
                            startPosition: { x: 0.49, y: 0.34 },
                            subElem: [ { id: "mouth", name: "الفم" }, { id: "lipupper", name: "الشفة العلوية" }, { id: "liplower", name: "الشفة السفلية" } ]
                        },
                        {
                            id: "upperbody",
                            name: "الجزء العلوي",
                            direction: "right",
                            visible: true,
                            startPosition: { x: 0.49, y: 0.43 },
                            subElem: [ { id: "arms", name: "الذراعين" }, { id: "shoulders", name: "الكتفين" }, { id: "chest", name: "الصدر" } ]
                        },
                        {
                            id: "clothes",
                            name: "الملابس",
                            direction: "left",
                            visible: true,
                            startPosition: { x: 0.49, y: 0.49 },
                            subElem: [ { id: "clothes", name: "متجر الملابس" } ]
                        },
                        {
                            id: "lowerbody",
                            name: "الساقان",
                            direction: "left",
                            visible: true,
                            startPosition: { x: 0.49, y: 0.70 },
                            subElem: [ { id: "legs", name: "الساقين" }, { id: "waist", name: "الخصر" } ]
                        }
                    ]
                }, '*');
            }, 600);
        };
    </script>
</body>
</html>

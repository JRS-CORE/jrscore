<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>معاينة أزرار ومؤشرات الشخصية</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/font_faces.css">
    <link rel="stylesheet" href="./css/character_theme.css">
    <link rel="stylesheet" href="./css/indicator.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <script src="./js/jquery.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #1a1a1a url("./img/preview_bg.jpg") no-repeat center center;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        #BodyPartsMenu {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
        }
        #pinContainer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        .preview-banner {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #d4af37;
            border: 1px solid #70542c;
            padding: 8px 24px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            z-index: 9999;
            pointer-events: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body class="lang-ar jrs-rtl">
    <div class="preview-banner">
        معاينة توزيع أشرطة ومؤشرات الشخصية (بدون تداخل أو تقاطع)
    </div>

    <div id="BodyPartsMenu">
        <div id="pinContainer"></div>
    </div>

    <script src="./locales/ar.js"></script>
    <script src="./script.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const testPins = [
                {
                    id: "head",
                    name: "الرأس",
                    direction: "left",
                    visible: true,
                    startPosition: { x: 0.49, y: 0.20 },
                    subElem: [
                        { id: "headshape", name: "شكل الرأس" },
                        { id: "neck", name: "الرقبة" },
                        { id: "barber", name: "الحلاق" }
                    ]
                },
                {
                    id: "eyesandbrows",
                    name: "العينان",
                    direction: "right",
                    visible: true,
                    startPosition: { x: 0.49, y: 0.25 },
                    subElem: [
                        { id: "brows", name: "الحواجب" },
                        { id: "eyes", name: "العيون" },
                        { id: "eyelid", name: "الجفون" }
                    ]
                },
                {
                    id: "mouth",
                    name: "الفم",
                    direction: "left",
                    visible: true,
                    startPosition: { x: 0.49, y: 0.32 },
                    subElem: [
                        { id: "mouth", name: "الفم" },
                        { id: "lipupper", name: "الشفة العلوية" },
                        { id: "liplower", name: "الشفة السفلية" }
                    ]
                },
                {
                    id: "facial",
                    name: "الوجه",
                    direction: "right",
                    visible: true,
                    startPosition: { x: 0.51, y: 0.35 },
                    subElem: [
                        { id: "ears", name: "الأذنين" },
                        { id: "cheekbone", name: "عظام الخد" },
                        { id: "jaw", name: "الفك" },
                        { id: "chin", name: "الذقن" },
                        { id: "nose", name: "الأنف" }
                    ]
                },
                {
                    id: "upperbody",
                    name: "الجزء العلوي",
                    direction: "right",
                    visible: true,
                    startPosition: { x: 0.49, y: 0.44 },
                    subElem: [
                        { id: "arms", name: "الذراعين" },
                        { id: "shoulders", name: "الكتفين" },
                        { id: "chest", name: "الصدر" }
                    ]
                },
                {
                    id: "clothes",
                    name: "الملابس",
                    direction: "left",
                    visible: true,
                    startPosition: { x: 0.49, y: 0.52 },
                    subElem: [
                        { id: "clothes", name: "متجر الملابس" }
                    ]
                },
                {
                    id: "lowerbody",
                    name: "الساقان",
                    direction: "left",
                    visible: true,
                    startPosition: { x: 0.49, y: 0.70 },
                    subElem: [
                        { id: "legs", name: "الساقين" },
                        { id: "waist", name: "الخصر" }
                    ]
                }
            ];

            const menu = document.getElementById('BodyPartsMenu');
            if (menu) menu.classList.remove('hidden');
            if (typeof createPin === 'function') {
                createPin(testPins);
            }
        });
    </script>
</body>
</html>

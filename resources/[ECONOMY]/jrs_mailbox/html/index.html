<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>jrs_mailbox</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main id="app" hidden>
    <header>
      <h1 id="title"></h1>
      <button id="closeBtn" type="button"></button>
    </header>

    <!-- inbox: list of letters on the left, the open letter on the right -->
    <section id="inbox" class="view">
      <ul id="letters"></ul>
      <article id="reader">
        <p id="emptyNote"></p>
        <h2 id="readFrom"></h2>
        <div id="readBody"></div>
      </article>
      <footer>
        <button id="writeBtn" type="button"></button>
        <button id="deleteBtn" type="button" disabled></button>
        <button id="answerBtn" type="button" disabled></button>
      </footer>
    </section>

    <!-- write to one person -->
    <section id="compose" class="view">
      <label for="people" id="toLabel"></label>
      <input id="filter" type="search" autocomplete="off">
      <select id="people" size="6"></select>
      <textarea id="letterText" maxlength="1000"></textarea>
      <footer>
        <button id="cancelBtn" type="button"></button>
        <button id="sendBtn" type="button"></button>
      </footer>
    </section>

    <!-- telegram to everyone -->
    <section id="shout" class="view">
      <textarea id="shoutText" maxlength="300"></textarea>
      <footer>
        <button id="shoutCancel" type="button"></button>
        <button id="shoutSend" type="button"></button>
      </footer>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>JRS Billing</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="panel" class="hidden">
  <header><div id="title">BILL</div></header>
  <form id="form">
    <label><span data-t="player">Player ID</span><input id="playerId" type="number" min="1" required></label>
    <label><span data-t="amount">Amount ($)</span><input id="amount" type="number" min="0.01" step="0.01" required></label>
    <label><span data-t="reason">Reason</span><input id="reason" type="text" maxlength="120" required></label>
    <div class="buttons"><button type="button" id="cancel" data-t="cancel">Cancel</button><button type="submit" id="send" data-t="send">Send bill</button></div>
  </form>
</div>
<script src="app.js"></script>
</body></html>

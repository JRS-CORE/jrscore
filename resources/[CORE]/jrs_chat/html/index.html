<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>jrs_chat</title>
  <link href="./css/style.css" rel="stylesheet">
</head>
<body>
  <div id="app">
    <div class="chat-window hidden" id="window">
      <div class="chat-messages" id="messages"></div>
    </div>
    <div class="chat-input" id="input-box" style="display:none">
      <div class="input-row">
        <textarea id="input" spellcheck="false" autofocus></textarea>
      </div>
      <div class="suggestions-wrap" id="suggestions" style="display:none">
        <ul class="suggestions" id="suggestion-list"></ul>
      </div>
    </div>
  </div>
  <script src="./js/config.js"></script>
  <script src="./js/Message.js"></script>
  <script src="./js/Suggestions.js"></script>
  <script src="./js/App.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JRS Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="chat-container" class="hidden">
        <!-- Message feed -->
        <div id="chat-messages"></div>

        <!-- Command suggestions -->
        <div id="chat-suggestions" class="hidden"></div>

        <!-- Chat input area -->
        <div id="chat-input-wrapper" class="hidden">
            <span class="chat-prefix">&#10148;</span>
            <input type="text" id="chat-input" maxlength="250" placeholder="اكتب رسالتك هنا... (/ للأوامر)" autocomplete="off" spellcheck="false">
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>jrs_progressbar</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="pb" class="pb" hidden>
    <div class="pb-line" data-part="line">
      <div class="pb-fill"></div>
      <span class="pb-text pb-line-text"></span>
    </div>
    <div class="pb-ring" data-part="ring">
      <div class="pb-dial">
        <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
          <circle class="pb-track" cx="32" cy="32" r="26" pathLength="100"></circle>
          <circle class="pb-arc" cx="32" cy="32" r="26" pathLength="100"></circle>
        </svg>
        <span class="pb-count"></span>
      </div>
      <span class="pb-text pb-ring-text"></span>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>

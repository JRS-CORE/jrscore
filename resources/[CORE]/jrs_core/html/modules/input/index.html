<html>
	<head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="index.css" type="text/css">
        <link rel="stylesheet" href="../../jrs-i18n.css" type="text/css">
        <link rel="stylesheet" href="jrs-theme.css" type="text/css">
        <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
        </head>
	<body>
        <!-- Text input dialog -->
        <div id="container">
            <form id="form_id">
                <div id="header"></div>
                <div id="header_desc"></div>
                <input type="text" id="text_input" autocomplete="off" spellcheck="false">
            </form>
            <div class="jrs-btn-row">
                <div id="button_2" onclick="send_values()" data-i18n="confirm">تأكيد</div>
                <div id="button_1" onclick="close_input()" data-i18n="leave">مغادرة</div>
            </div>
            <input type="submit" style="display:none;" />
        </div>

        <!-- Yes/No answer dialog -->
        <div id="container2">
                <div id="header2"></div>
                <div class="jrs-btn-row">
                    <div id="button_2_ans" onclick="yes_func()"></div>
                    <div id="button_1_ans" onclick="no_func()"></div>
                </div>
            </div>
        <script src="nui://jrs_core/html/jrs-i18n.js" type="text/javascript"></script>
        <script src="./locales/en.js" type="text/javascript"></script>
        <script src="./locales/ar.js" type="text/javascript"></script>
        <script src="./index.js" type="text/javascript"></script>
	    <script src="nui://jrs_core/html/jrs-pad.js"></script>
</body>
        <script>
                $(document).ready(function() {
                        $(window).keydown(function(event){
                                if(event.keyCode == 13) {
                                        event.preventDefault();
                                        return false;
                                }
                        });
                });
        </script>
</html>

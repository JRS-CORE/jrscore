<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Balloon Controls</title>
<style>
    /* JRS flight controls HUD - jrs_stores artwork */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; pointer-events: none; }
    .hidden { display: none !important; }
    .fc {
        position: fixed; left: clamp(14px, 1.4vw, 40px); top: 50%; transform: translateY(-50%);
        width: clamp(230px, 14vw, 380px);
        background: url(nui://jrs_core/html/storeui/panel-background.png) center / 100% 100% no-repeat;
        filter: drop-shadow(0 14px 28px rgba(0,0,0,.7));
        color: #f4f0e7; font-family: Georgia, 'Times New Roman', serif;
        padding-bottom: 12px; animation: in .18s ease-out;
    }
    @keyframes in { from { opacity: 0; transform: translate(-10px, -50%); } to { opacity: 1; transform: translateY(-50%); } }
    .fc-head {
        background: url(nui://jrs_core/html/storeui/ui-header.png) center / 100% 100% no-repeat;
        padding: clamp(12px, 1.4vh, 26px) 12px clamp(8px, 1vh, 18px);
        text-align: center; font-weight: 800; letter-spacing: .09em; text-transform: uppercase;
        font-size: clamp(13px, 1.5vh, 28px); color: #fff; text-shadow: 0 2px 4px #000;
    }
    .fc-row {
        display: flex; align-items: center; gap: 10px;
        margin: clamp(4px, .5vh, 9px) 12px 0;
        padding: clamp(5px, .6vh, 11px) 10px;
        background: url(nui://jrs_core/html/storeui/card.png) center / 100% 100% no-repeat;
        font-size: clamp(12px, 1.3vh, 24px); font-weight: 700; text-shadow: 0 1px 2px #000; opacity: .85;
    }
    .fc-row.fc-active { opacity: 1; box-shadow: inset 3px 0 0 rgba(255,255,255,.85); filter: brightness(1.2); }
    .fc-key {
        min-width: 3.2em; text-align: center; padding: 2px 6px;
        background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.3);
        font-family: Arial, Helvetica, sans-serif; font-size: .8em; letter-spacing: 0;
        transition: background .08s, border-color .08s;
    }
    .fc-key.fc-pressed { background: rgba(255,255,255,.85); color: #111; border-color: #fff; text-shadow: none; }
    .fc-label { flex: 1; }
    .fc-state { color: #7ad6a3; font-size: .85em; }
    body.rtl .fc { direction: rtl; left: auto; right: clamp(14px, 1.4vw, 40px); }
</style>
</head>
<body>
<div class="fc hidden" id="flightControls">
    <div class="fc-head" id="fcTitleText">Balloon Controls</div>
    <div id="fcRows"></div>
</div>
<script>
(() => {
    const L = {
        controlsPanelTitle: 'Balloon Controls', locked: 'Locked', burnerAscend: 'Burner (Ascend)',
        driftForward: 'Drift Forward', driftLeft: 'Drift Left', driftRight: 'Drift Right',
        driftBackward: 'Drift Backward', altitudeLock: 'Altitude Lock', brake: 'Brake'
    };
    const box = document.getElementById('flightControls');
    const rows = document.getElementById('fcRows');
    let locked = false;

    function controls() {
        return [
            { key: 'SHIFT', label: L.burnerAscend },
            { key: 'W', label: L.driftForward },
            { key: 'A', label: L.driftLeft },
            { key: 'D', label: L.driftRight },
            { key: 'S', label: L.driftBackward },
            { key: 'SPACE', label: L.altitudeLock, dynamic: true },
            { key: 'R', label: L.brake },
        ];
    }

    function esc(s) { const d = document.createElement('div'); d.textContent = String(s == null ? '' : s); return d.innerHTML; }

    function render() {
        document.getElementById('fcTitleText').textContent = L.controlsPanelTitle;
        rows.innerHTML = controls().map(c => {
            const on = c.dynamic && locked;
            return `<div class="fc-row${on ? ' fc-active' : ''}"><span class="fc-key" data-key="${c.key}">${c.key}</span>` +
                `<span class="fc-label">${esc(c.label)}</span>${c.dynamic ? `<span class="fc-state">${on ? esc(L.locked) : ''}</span>` : ''}</div>`;
        }).join('');
    }

    window.addEventListener('message', (event) => {
        const data = event.data || {};
        switch (data.type) {
            case 'setLocale':
                Object.assign(L, data.strings || {});
                if (data.rtl !== undefined) document.body.classList.toggle('rtl', !!data.rtl);
                render();
                break;
            case 'showFlightControls':
                locked = !!data.altitudeLocked; render(); box.classList.remove('hidden'); break;
            case 'updateFlightControls':
                locked = !!data.altitudeLocked; render(); break;
            case 'hideFlightControls':
                box.classList.add('hidden'); break;
            case 'flightControlsPressed':
                rows.querySelectorAll('.fc-key').forEach(el => el.classList.toggle('fc-pressed', !!(data.pressed || {})[el.dataset.key]));
                break;
        }
    });
    render();
})();
</script>
</body>
</html>
